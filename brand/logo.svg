<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" rx="0" fill="#0e0c09"/>
  <!-- faint session grid: the trading day -->
  <g stroke="#1f1b15" stroke-width="2">
    <line x1="64" y1="128" x2="448" y2="128"/><line x1="64" y1="384" x2="448" y2="384"/>
  </g>
  <!-- the bell, split by the gap -->
  <g fill="none" stroke="#e9a23b" stroke-width="30" stroke-linecap="butt" stroke-linejoin="miter">
    <!-- upper half of the bell (above the gap) -->
    <path d="M168 238 C168 170 204 124 256 124 C308 124 344 170 344 238"/>
    <!-- lower half of the bell (below the gap) -->
    <path d="M168 286 C168 314 158 334 136 352 L376 352 C354 334 344 314 344 286"/>
  </g>
  <!-- the gap: a bright cut across the bell -->
  <rect x="112" y="252" width="288" height="18" fill="#ff6a45"/>
  <!-- clapper -->
  <circle cx="256" cy="394" r="20" fill="#e9a23b"/>
  <!-- crown -->
  <rect x="244" y="92" width="24" height="26" fill="#e9a23b"/>
</svg>
